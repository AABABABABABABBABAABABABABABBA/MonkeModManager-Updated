name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build MonkeModManager.sln -c Release

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: MonkeModManager
          path: MonkeModManager/bin/Release/net472/MonkeModManager.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MonkeModManager/bin/Release/net472/MonkeModManager.exe
          generate_release_notes: true
